name: RMST CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
concurrency:
  group: rmst-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Check distributable command
        run: |
          rmst --help
          python -m compileall -q agents rmst_calc.py cli.py enrichment.py simulator.py
      - name: Browser-native JavaScript tests
        run: node --test tests/web.test.cjs
